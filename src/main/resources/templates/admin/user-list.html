<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background:
              linear-gradient(
                      rgba(255, 255, 255, 0.85),
                      rgba(255, 255, 255, 0.85)
              ),
              url('https://images.unsplash.com/photo-1497366216548-37526070297c?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2069&q=80') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .user-management-container {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      width: 95%;
      max-width: 1400px;
      min-height: 700px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      position: relative;
      overflow: hidden;
    }

    .user-management-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #007bff, #0056b3, #007bff);
      border-radius: 20px 20px 0 0;
    }

    .table-container {
      max-height: 550px;
      overflow-y: auto;
      border-radius: 12px;
      border: 1px solid #e9ecef;
      background: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .table {
      margin-bottom: 0;
      border-radius: 12px;
      overflow: hidden;
    }

    .table thead th {
      background: linear-gradient(135deg, #343a40, #495057);
      color: white;
      position: sticky;
      top: 0;
      z-index: 10;
      border: none;
      padding: 18px 20px;
      font-weight: 600;
      font-size: 1.05em;
      text-align: center;
    }

    .table tbody td {
      padding: 16px 20px;
      vertical-align: middle;
      border-color: #f8f9fa;
      text-align: center;
    }

    .table tbody tr:hover {
      background-color: rgba(0, 123, 255, 0.05);
      transform: translateY(-1px);
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: #2c3e50;
      border-bottom: none;
      padding-bottom: 15px;
      margin-bottom: 30px;
      text-align: center;
      font-weight: 700;
      font-size: 2.2em;
      background: linear-gradient(135deg, #2c3e50, #34495e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
    }

    h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, #007bff, #0056b3);
      border-radius: 2px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #007bff, #0056b3);
      border: none;
      border-radius: 10px;
      padding: 12px 25px;
      font-weight: 600;
      font-size: 1.05em;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 123, 255, 0.4);
      background: linear-gradient(135deg, #0056b3, #004085);
    }

    .btn-warning {
      background: linear-gradient(135deg, #ffc107, #e0a800);
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(255, 193, 7, 0.3);
    }

    .btn-danger {
      background: linear-gradient(135deg, #dc3545, #c82333);
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(220, 53, 69, 0.3);
    }

    .btn-warning:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
      background: linear-gradient(135deg, #e0a800, #d39e00);
    }

    .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
      background: linear-gradient(135deg, #c82333, #bd2130);
    }

    .alert {
      border-radius: 12px;
      border: none;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      padding: 15px 20px;
      font-size: 1.05em;
    }

    .badge {
      font-size: 0.9em;
      padding: 10px 16px;
      border-radius: 25px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    /* Custom scrollbar */
    .table-container::-webkit-scrollbar {
      width: 10px;
    }

    .table-container::-webkit-scrollbar-track {
      background: #f8f9fa;
      border-radius: 6px;
    }

    .table-container::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #007bff, #0056b3);
      border-radius: 6px;
    }

    .table-container::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, #0056b3, #004085);
    }

    /* Header styling */
    .d-flex.justify-content-between {
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
      padding: 20px 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 1px solid #e9ecef;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .btn-group {
      gap: 8px;
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 0.95em;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .user-management-container {
        padding: 25px;
        margin: 15px;
        width: calc(100% - 30px);
      }

      .table thead th,
      .table tbody td {
        padding: 12px 15px;
      }

      .btn-group {
        flex-direction: column;
        gap: 5px;
      }
    }
  </style>
</head>
<body>
<div class="user-management-container">
  <h2>User Management</h2>

  <div th:if="${param.success}" class="alert alert-success">
    <i class="fas fa-check-circle"></i> User operation completed successfully!
  </div>
  <div th:if="${param.deleted}" class="alert alert-warning">
    <i class="fas fa-exclamation-triangle"></i> User deleted successfully!
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <a th:href="@{/admin/users/add}" class="btn btn-primary">
      <i class="fas fa-plus"></i> Add New User
    </a>
    <span class="badge bg-secondary fs-6">Total Users: <span th:text="${users.size()}">0</span></span>
  </div>

  <div class="table-container">
    <table class="table table-striped table-hover">
      <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="user : ${users}">
        <td th:text="${user.userId}" class="fw-bold"></td>
        <td th:text="${user.username}"></td>
        <td>
          <span th:text="${user.roleName}"
                th:class="${user.roleName == 'ADMIN'} ? 'badge bg-danger' : 'badge bg-primary'">
          </span>
        </td>
        <td>
          <div class="btn-group" role="group">
            <a th:href="@{/admin/users/edit/{id}(id=${user.userId})}"
               class="btn btn-warning btn-sm">
              <i class="fas fa-edit"></i> Edit
            </a>
            <a th:href="@{/admin/users/delete/{id}(id=${user.userId})}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Are you sure you want to delete this user?')">
              <i class="fas fa-trash"></i> Delete
            </a>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Add Font Awesome for icons -->
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
